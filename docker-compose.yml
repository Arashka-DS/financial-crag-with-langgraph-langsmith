version: '3.8'

services:
  crag_postgres:
    image: pgvector/pgvector:pg15
    container_name: crag_vector_db
    environment:
      POSTGRES_USER: crag_admin
      POSTGRES_PASSWORD: crag_password
      POSTGRES_DB: crag_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_crag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag_admin -d crag_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  crag_api:
    build: .
    container_name: crag_fastapi
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=crag_postgres
      - DB_USER=crag_admin
      - DB_PASSWORD=crag_password
      - DB_NAME=crag_warehouse
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=FinTech_CRAG
    volumes:
      - ./src:/app/src
    command: >
      bash -c "sleep 5 && python src/seed_data.py && 
               uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      crag_postgres:
        condition: service_healthy

  crag_ui:
    build: .
    container_name: crag_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://crag_api:8000
    volumes:
      - ./frontend:/app/frontend
    command: streamlit run frontend/app.py --server.address 0.0.0.0
    depends_on:
      - crag_api

volumes:
  pg_crag_data:
